# Keeps the Worker's secrets the same as the synced .env.local.
# Runs when secrets/env.local.enc changes on master (after `node scripts/env-sync.mjs push`), or by
# hand from the Actions tab. If the file didn't change, it doesn't run and Cloudflare stays as it is.
#
# One-time setup, in GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   POWERPROOF_ENV_KEY        the contents of ~/.powerproof/env.key (decrypts the synced copy)
#   CLOUDFLARE_SECRETS_TOKEN  a Cloudflare user API token with "Workers Scripts: Edit" on the account
# Secrets are never printed: the decrypted file lives only in the runner's temp folder and is deleted.
name: Cloudflare secrets

on:
  push:
    branches: [master]
    paths: [secrets/env.local.enc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the setup
        env:
          POWERPROOF_ENV_KEY: ${{ secrets.POWERPROOF_ENV_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRETS_TOKEN }}
        run: |
          if [ -z "$POWERPROOF_ENV_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the POWERPROOF_ENV_KEY and CLOUDFLARE_SECRETS_TOKEN repository secrets (see the top of this file)."
            exit 1
          fi

      - name: Decrypt the server secrets
        env:
          POWERPROOF_ENV_KEY: ${{ secrets.POWERPROOF_ENV_KEY }}
        run: node scripts/env-sync.mjs cloudflare "$RUNNER_TEMP/worker-secrets.json"

      - name: Upload them to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRETS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f3f32436324109fe66c8593b20989fc3
        run: npx --yes wrangler@4.149.0 secret bulk "$RUNNER_TEMP/worker-secrets.json" --name powerproof-pro

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
